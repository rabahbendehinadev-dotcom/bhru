openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /external-providers:
    get:
      operationId: listExternalProviders
      tags: [ExternalProviders]
      responses:
        "200":
          description: Tenant provider list, no credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderList"}
    post:
      operationId: createExternalProvider
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "201":
          description: Saved, not automatically connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderConnection"}
  /external-providers/test:
    post:
      operationId: testExternalProviderDraft
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "200":
          description: Real bounded account read with transient credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderTestResult"}
  /external-providers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateExternalProvider
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderInput"}
      responses:
        "200":
          description: Updated connection; credentials replace-only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderConnection"}
  /external-providers/{id}/jobs:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listExternalProviderJobs
      tags: [ExternalProviders]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000}}
      responses:
        "200":
          description: Persisted test/sync history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderJobList"}
    post:
      operationId: startExternalProviderJob
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderJobInput"}
      responses:
        "202":
          description: Durable job queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderJob"}
  /external-providers/{id}/catalog:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getExternalProviderCatalog
      tags: [ExternalProviders]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: category, in: query, schema: {type: string, maxLength: 128}}
        - {name: serviceType, in: query, schema: {type: string, enum: [imei,server,file,remote]}}
        - {name: changedOnly, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Staging only; linked retail services are never overwritten
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderCatalogList"}
  /external-providers/{id}/pricing:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: saveExternalProviderPricing
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderPricingPolicy"}
      responses:
        "200":
          description: Initial import defaults only; no live retail repricing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderConnection"}
  /external-providers/{id}/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: previewExternalProviderImport
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderImportInput"}
      responses:
        "200":
          description: Server-calculated exact price/FX preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderImportPreview"}
  /external-providers/{id}/import:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: importExternalProviderServices
      tags: [ExternalProviders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderImportInput"}
      responses:
        "200":
          description: Atomic canonical imports, inactive and non-orderable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderImportResult"}
  /payment-reviews:
    get:
      operationId: listPaymentReviews
      tags: [Payments]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Read-only tenant-scoped review queue including unassociated authentic receipts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentReviewList"}
  /admin/payment-monitoring:
    get:
      operationId: getAdminPaymentMonitoring
      tags: [Payments]
      responses:
        "200":
          description: Aggregate-only operational monitoring; no reseller secrets or customer data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMonitoringList"}
  /funding-requests/{id}/reconciliation:
    get:
      operationId: getFundingReconciliation
      tags: [Payments]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Read-only tenant-scoped payment and ledger diagnostics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentReconciliation"}
  /public/customer/{slug}/panel/funding/initiate:
    post:
      operationId: initiateCustomerPayment
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundingCreateInput"}
      responses:
        "202":
          description: Durable initiation accepted; not proof of payment or wallet credit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingView"}
  /payments/webhooks/{code}/{binding}:
    post:
      operationId: receiveProviderWebhook
      tags: [Payments]
      description: Raw bytes authenticated exclusively by a trusted installed provider verifier. No browser/session confirmation.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: binding, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: Authenticated evidence durably queued; does not imply settlement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookAcknowledgement"}
  /admin/payment-gateways:
    get:
      operationId: listAdminPaymentGateways
      tags: [Payments]
      responses:
        "200":
          description: Trusted installed gateway catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayList"}
  /admin/payment-gateways/{code}:
    patch:
      operationId: updateAdminPaymentGateway
      tags: [Payments]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminGatewayPolicyInput"}
      responses:
        "200":
          description: Updated availability policy, not integration code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayView"}
  /payment-gateways:
    get:
      operationId: listResellerPaymentGateways
      tags: [Payments]
      responses:
        "200":
          description: Own gateway configuration; secrets excluded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayList"}
  /payment-gateways/{code}:
    put:
      operationId: configureResellerPaymentGateway
      tags: [Payments]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GatewayConfigInput"}
      responses:
        "200":
          description: Saved own configuration without secret disclosure
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayView"}
  /payment-gateways/{code}/validate:
    post:
      operationId: validateResellerPaymentGateway
      tags: [Payments]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyPaymentAction"}
      responses:
        "200":
          description: Adapter validation result, never fabricated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayView"}
  /funding-requests:
    get:
      operationId: listResellerFundingRequests
      tags: [Payments]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: filter, in: query, schema: {type: string, enum: [ALL, PENDING, PAID, FAILED, EXPIRED, REVIEW_REQUIRED]}}
      responses:
        "200":
          description: Own tenant funding and payment history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingList"}
  /funding-requests/{id}:
    get:
      operationId: getResellerFundingRequest
      tags: [Payments]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tenant-owned request and payment transactions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingView"}
  /public/customer/{slug}/panel/funding:
    get:
      operationId: listCustomerFundingRequests
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Own funding history, separate from account statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingList"}
    post:
      operationId: createCustomerFundingRequest
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundingCreateInput"}
      responses:
        "201":
          description: Frozen funding intent; not payment confirmation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingView"}
  /public/customer/{slug}/panel/funding/gateways:
    get:
      operationId: listCustomerFundingGateways
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Only operational, globally and tenant enabled, compatible gateways
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayList"}
  /public/customer/{slug}/panel/funding/quote:
    post:
      operationId: quoteCustomerFunding
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundingIntent"}
      responses:
        "200":
          description: Exact server-calculated preview; creation freezes final snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingQuote"}
  /public/customer/{slug}/panel/funding/{id}:
    get:
      operationId: getCustomerFundingRequest
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Own funding request and safe payment status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingView"}
  /public/customer/{slug}/panel/funding/{id}/cancel:
    post:
      operationId: cancelCustomerFundingRequest
      tags: [Payments]
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyPaymentAction"}
      responses:
        "200":
          description: Unpaid funding request cancelled; no wallet mutation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundingView"}
  /manual-services:
    get:
      operationId: listManualServices
      parameters:
        - {$ref: '#/components/parameters/FoundationPage'}
        - {$ref: '#/components/parameters/FoundationSearch'}
        - {$ref: '#/components/parameters/FoundationServiceType'}
        - {in: query, name: groupId, schema: {type: string, format: uuid}}
        - {in: query, name: status, schema: {type: string, enum: [active, inactive]}}
      responses:
        '200': {description: Tenant catalog, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    post:
      operationId: createManualService
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualServiceInput'}}}}
      responses:
        '201': {description: Saved service, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /manual-services/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getManualService
      responses:
        '200': {description: Tenant service, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    patch:
      operationId: updateManualService
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualServiceInput'}}}}
      responses:
        '200': {description: Saved service, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /service-groups:
    get:
      operationId: listServiceGroups
      responses:
        '200': {description: Tenant groups, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    post:
      operationId: createServiceGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationGroupInput'}}}}
      responses:
        '201': {description: Created group, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /service-groups/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateServiceGroupAvailability
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceGroupAvailability'}}}}
      responses:
        '200': {description: Updated tenant service group availability, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /client-groups:
    get:
      operationId: listClientGroups
      responses:
        '200': {description: Tenant client groups with counts, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroupList'}}}}
    post:
      operationId: createClientGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroupInput'}}}}
      responses:
        '201': {description: Created group, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroup'}}}}
  /client-groups/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateClientGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroupInput'}}}}
      responses:
        '200': {description: Updated group, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroup'}}}}
    delete:
      operationId: deleteUnusedClientGroup
      responses:
        '200': {description: Deleted unused nondefault group, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /client-groups/{id}/default:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: selectDefaultClientGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyInput'}}}}
      responses:
        '200': {description: New active default without reassigning customers, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroup'}}}}
  /client-groups/{id}/pricing:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: query, name: search, schema: {type: string}}, {in: query, name: page, schema: {type: integer, minimum: 1}}]
    get:
      operationId: listGroupServicePricing
      responses:
        '200': {description: Standard and effective USD prices and rules, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePricingList'}}}}
  /client-groups/{id}/pricing/{serviceId}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: path, name: serviceId, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: saveGroupServicePricing
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePricingInput'}}}}
      responses:
        '200': {description: Saved or inherited pricing rule, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    delete:
      operationId: removeGroupServicePricing
      responses:
        '200': {description: Rule removed, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /clients/{id}/pricing:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: query, name: search, schema: {type: string}}, {in: query, name: page, schema: {type: integer, minimum: 1}}]
    get:
      operationId: listCustomerServicePricing
      responses:
        '200': {description: Customer overrides and effective USD prices, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePricingList'}}}}
  /clients/{id}/pricing/{serviceId}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: path, name: serviceId, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: saveCustomerServicePricing
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePricingInput'}}}}
      responses:
        '200': {description: Saved or inherited customer rule, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    delete:
      operationId: removeCustomerServicePricing
      responses:
        '200': {description: Removed customer rule, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /clients/{id}/price-preview/{serviceId}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: path, name: serviceId, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: previewCustomerServicePrice
      responses:
        '200': {description: Authoritative customer price and provenance, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveServicePrice'}}}}
  /clients/{id}/group:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: assignClientGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientGroupAssignment'}}}}
      responses:
        '200': {description: Assigned group, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /clients/{id}/reconciliation:
    get:
      operationId: getClientReconciliation
      tags: [Clients]
      summary: Read-only financial integrity diagnostic for an authorized reseller
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Exact account-currency reconciliation; never repairs financial data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientReconciliation'
        '401': {description: Authentication required}
        '403': {description: Subscriber access denied}
        '404': {description: Client wallet not found in this subscriber}
  /clients/{id}/wallet:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getClientWallet
      responses:
        '200': {description: Consistent account-currency financial summary with completed-only spending, content: {application/json: {schema: {$ref: '#/components/schemas/ClientFinancialSummary'}}}}
    post:
      operationId: mutateClientWallet
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WalletMutationInput'}}}}
      responses:
        '200': {description: Idempotent immutable movement, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /clients/{id}/statement:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getClientStatement
      parameters:
        - {$ref: '#/components/parameters/FoundationPage'}
        - {$ref: '#/components/parameters/FoundationSearch'}
        - {in: query, name: direction, schema: {type: string, enum: [credit, debit]}}
        - {in: query, name: type, schema: {type: string, enum: [admin_credit, admin_debit, adjustment, order_debit, order_refund, payment_credit]}}
      responses:
        '200': {description: Paginated internal statement, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /service-orders:
    get:
      operationId: listServiceOrders
      parameters:
        - {$ref: '#/components/parameters/FoundationPage'}
        - {$ref: '#/components/parameters/FoundationSearch'}
        - {$ref: '#/components/parameters/FoundationServiceType'}
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
        - {in: query, name: status, schema: {type: string, enum: [pending, processing, completed, rejected, cancelled]}}
      responses:
        '200': {description: Tenant service orders, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /service-orders/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getServiceOrder
      responses:
        '200': {description: Order and immutable snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
    put:
      operationId: transitionServiceOrder
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderTransition'}}}}
      responses:
        '200': {description: Validated transition with atomic rejection refund, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /public/customer/{slug}/panel:
    parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
    get:
      operationId: getCustomerPanel
      responses:
        '200': {description: Own financial summary and real service-order metrics, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /public/customer/{slug}/panel/services:
    parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
    get:
      operationId: listCustomerServices
      parameters:
        - {$ref: '#/components/parameters/FoundationPage'}
        - {$ref: '#/components/parameters/FoundationSearch'}
        - {$ref: '#/components/parameters/FoundationServiceType'}
        - {in: query, name: groupId, schema: {type: string, format: uuid}}
        - {in: query, name: currency, schema: {type: string, minLength: 3, maxLength: 3}}
      responses:
        '200': {description: Active tenant services with exact formatted prices, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /public/customer/{slug}/panel/services/{id}:
    parameters: [{in: path, name: slug, required: true, schema: {type: string}}, {in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getCustomerService
      responses:
        '200': {description: Active service and requirement fields, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /public/customer/{slug}/panel/quote:
    parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
    post:
      operationId: quoteCustomerService
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceQuoteInput'}}}}
      responses:
        '200': {description: Server price and sufficient-funds assessment, content: {application/json: {schema: {$ref: '#/components/schemas/FoundationResponse'}}}}
  /public/customer/{slug}/panel/orders:
    parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
    get:
      operationId: listCustomerServiceOrders
      parameters:
