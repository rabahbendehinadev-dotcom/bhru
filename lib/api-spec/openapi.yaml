      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    CommerceEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        page: { type: integer }
        has_more: { type: boolean }
    CommerceInput:
      type: object
      additionalProperties: true
      description: "Strict resource inputs. Products price/compare_at are canonical USD decimal strings, max 12 decimals; price_usd_units is the authoritative 10^12-scaled integer in model 2. price_minor is a derived cents projection only. Currency rates are manual target units per USD, max six decimals. display-currency accepts {code} and persists a user display preference only. Model 1 amounts retain their legacy denomination. Quotes/snapshots expose money_model_version, canonical_scale and immutable converted customer amounts."

