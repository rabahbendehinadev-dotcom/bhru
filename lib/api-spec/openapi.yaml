openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /public/site-document:
    get:
      operationId: getPublicSiteDocument
      summary: Resolve an anonymous public URL to an isolated HTML document
      description: |
        Uses only public business/company names. Never loads session ownership,
        account state, licence details or admin metadata. Existing application
        namespaces return an empty 204 so the development server can continue
        its existing routing. Malformed, unknown and ineligible sites share 404.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Shared eligible subscriber public homepage; names and safe generic rendering defaults
          content:
            text/html:
              schema: { type: string }
        "204": { description: Existing application or infrastructure namespace; no public document }
        "404":
          description: Generic unavailable document; no subscriber or eligibility details
          content:
            text/html:
              schema: { type: string }
        "503":
          description: Generic temporary service-unavailable document
          content:
            text/html:
              schema: { type: string }
  /cms/public-website:
    get:
      operationId: getCurrentPublicWebsite
      responses:
        "200":
          description: Authenticated subscriber website configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicWebsiteConfiguration" }
        "401": { description: Authentication required }
        "403": { description: Eligible subscriber required }
    put:
      operationId: updateCurrentPublicWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicWebsiteUpdate" }
      responses:
        "200":
          description: Confirmed saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicWebsiteConfiguration" }
        "400": { description: Invalid input or image ownership }
        "409": { description: Configuration changed since it was loaded }
  /cms/public-website/preview:
    post:
      operationId: previewCurrentPublicWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicWebsitePreviewInput" }
      responses:
        "200":
          description: Same frozen shared template rendered with unsaved owned values
          content:
            application/json:
              schema:
                type: object
                required: [html, logo_url, hero_image_url]
                properties:
                  html: { type: string }
                  logo_url: { type: [string, "null"] }
                  hero_image_url: { type: [string, "null"] }
                  asset_urls:
                    type: object
                    additionalProperties: { type: string }
  /cms/public-website/presentation:
    get:
      operationId: getCurrentPublicPresentation
      responses:
        "200":
          description: Authenticated subscriber Top Area and Banner configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPresentationConfiguration" }
    put:
      operationId: updateCurrentPublicPresentation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicPresentationUpdate" }
      responses:
        "200":
          description: Confirmed saved Top Area and Banner configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPresentationConfiguration" }
        "400": { description: Invalid input or image ownership }
        "409": { description: Revision conflict }
  /cms/public-website/assets:
    post:
      operationId: uploadPublicWebsiteAsset
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Validated, normalized subscriber-owned image
          content:
            application/json:
              schema:
                type: object
                required: [id, url]
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string }
        "400": { description: Invalid image }
        "413": { description: Image exceeds 5 MB }
  /cms/public-website/assets/{assetId}:
    delete:
      operationId: deleteUnusedPublicWebsiteAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unreferenced owned image removed }
        "404": { description: Image not found for this subscriber }
        "409": { description: Image is still used by saved website configuration }
  /settings/general:
    get:
      operationId: getCurrentGeneralSettings
      summary: Read the eligible authenticated subscriber's General Settings
      responses:
        "200":
          description: Persisted configuration; identity comes from the session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "401": { description: Authentication required }
        "403": { description: Subscriber account and eligible licence required }
    put:
      operationId: updateCurrentGeneralSettings
      summary: Replace the eligible authenticated subscriber's General Settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneralSettingsInput" }
      responses:
        "200":
          description: Confirmed persisted configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "400": { description: Invalid fields or unexpected properties }
        "401": { description: Authentication required }
        "403": { description: Subscriber account and eligible licence required }
  /auth/entry:
    get:
      operationId: resolveAuthEntry
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Runtime entry context; private path returned only at that entry or to an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEntry" }
        "403":
          description: Subscriber cannot access the admin entry
  /auth/admin-login:
    post:
      operationId: loginAdministrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCredentialsInput" }
      responses:
        "200":
          description: Authenticated platform administrator; session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
        "403":
          description: Account has no platform administrator membership
  /auth/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Registered as pending; authenticated owner session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /auth/login:
    post:
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialsInput" }
      responses:
        "200":
          description: Authenticated; session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /auth/logout:
    post:
      operationId: logoutAccount
      responses:
        "200":
          description: Session invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /state:
    get:
      operationId: getPlatformState
      responses:
        "200":
          description: Admin data or only the authenticated subscriber's own metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/plans:
    post:
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan created; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan updated including enable/disable; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/subscribers/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: manageSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAction" }
      responses:
        "200":
          description: Transactional licence change and audit event; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/subscribers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editSubscriber
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriberUpdate" }
      responses:
        "200":
          description: Subscriber details updated; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /subscribers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubscriber
      responses:
        "200":
          description: Owner's own subscriber or admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriber" }
  /subscribers/{id}/panel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubscriberPanel
      responses:
        "200":
          description: Tenant checked and licence allowed; business modules remain deferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelAccess" }
        "403":
          description: Tenant mismatch or pending/suspended/expired/revoked licence
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PublicWebsiteUpdate:
      type: object
      additionalProperties: false
      required: [values, revision]
      properties:
        values: { $ref: "#/components/schemas/PublicWebsiteValues" }
        revision: { type: integer, minimum: 0 }
        presentation: { $ref: "#/components/schemas/PublicPresentationValues" }
        presentation_revision: { type: integer, minimum: 0 }
    PublicWebsitePreviewInput:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: { $ref: "#/components/schemas/PublicWebsiteValues" }
        presentation: { $ref: "#/components/schemas/PublicPresentationValues" }
    PublicPresentationUpdate:
      type: object
      additionalProperties: false
      required: [values, revision]
      properties:
        values: { $ref: "#/components/schemas/PublicPresentationValues" }
        revision: { type: integer, minimum: 0 }
    PublicPresentationConfiguration:
      type: object
      required: [values, revision, asset_urls]
      properties:
        values: { $ref: "#/components/schemas/PublicPresentationValues" }
        revision: { type: integer, minimum: 0 }
        asset_urls:
          type: object
          additionalProperties: { type: string }
    PublicPresentationValues:
      type: object
      additionalProperties: false
      required: [logo_strip_enabled, announcements_enabled, custom_html_enabled, custom_html, hero_mode, slider_autoplay, slider_interval, logos, announcements, banners]
      properties:
        logo_strip_enabled: { type: boolean }
        announcements_enabled: { type: boolean }
        logo_strip_settings: { $ref: "#/components/schemas/PublicStripSettings" }
        announcement_ticker_settings: { $ref: "#/components/schemas/PublicTickerSettings" }
        custom_html_enabled: { type: boolean }
        custom_html: { type: string, maxLength: 4096 }
        hero_mode: { type: string, enum: [classic, banner] }
        slider_autoplay: { type: boolean }
        slider_interval: { type: integer, enum: [3, 5, 7, 10] }
        logos:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/PublicPartnerLogo" }
        announcements:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/PublicAnnouncement" }
        banners:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/PublicBanner" }
    PublicStripSettings:
      type: object
      additionalProperties: false
      required: [display, speed, direction, pause_on_hover]
      properties:
        display: { type: string, enum: [static, moving] }
        speed: { type: string, enum: [slow, normal, fast] }
        direction: { type: string, enum: [left, right] }
        pause_on_hover: { type: boolean }
    PublicTickerSettings:
      type: object
      additionalProperties: false
      required: [display, speed, direction, pause_on_hover, background_color, text_color, separator]
      properties:
        display: { type: string, enum: [static, moving] }
        speed: { type: string, enum: [slow, normal, fast] }
        direction: { type: string, enum: [left, right] }
        pause_on_hover: { type: boolean }
        background_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        text_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        separator: { type: string, maxLength: 16 }
    PublicPartnerLogo:
      type: object
      additionalProperties: false
      required: [id, asset_id, label, destination, new_tab, enabled]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        label: { type: string, maxLength: 120 }
        destination: { type: string, maxLength: 512 }
        new_tab: { type: boolean }
        enabled: { type: boolean }
    PublicAnnouncement:
      type: object
      additionalProperties: false
      required: [id, enabled, text, destination, background_color, text_color, movement, direction, speed]
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }
        text: { type: string, minLength: 1, maxLength: 500 }
        icon_text: { type: string, maxLength: 32 }
        destination: { type: string, maxLength: 512 }
        background_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        text_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        movement: { type: string, enum: [static, scrolling] }
        direction: { type: string, enum: [left, right] }
        speed: { type: string, enum: [slow, normal, fast] }
    PublicBanner:
      type: object
      additionalProperties: false
      required: [id, asset_id, alt_text, destination, enabled]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        alt_text: { type: string, maxLength: 180 }
        destination: { type: string, maxLength: 512 }
        enabled: { type: boolean }
    PublicWebsiteValues:
      type: object
      additionalProperties: false
      required: [display_name, business_description, primary_color, hero_badge, hero_title, hero_description, logo_asset_id, hero_asset_id, primary_cta_label, primary_cta_destination, secondary_cta_label, secondary_cta_destination]
      properties:
        display_name: { type: string, maxLength: 120 }
        business_description: { type: string, maxLength: 500 }
        primary_color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        hero_badge: { type: string, maxLength: 120 }
        hero_title: { type: string, maxLength: 180 }
        hero_description: { type: string, maxLength: 1000 }
        logo_asset_id: { type: [string, "null"], format: uuid }
        hero_asset_id: { type: [string, "null"], format: uuid }
        primary_cta_label: { type: string, maxLength: 60 }
        primary_cta_destination: { type: string, maxLength: 512 }
        secondary_cta_label: { type: string, maxLength: 60 }
        secondary_cta_destination: { type: string, maxLength: 512 }
    PublicWebsiteConfiguration:
      type: object
      required: [values, defaults, revision, public_slug, public_url, preview_url, logo_url, hero_image_url]
      properties:
        values: { $ref: "#/components/schemas/PublicWebsiteValues" }
        presentation: { $ref: "#/components/schemas/PublicPresentationConfiguration" }
        defaults: { $ref: "#/components/schemas/PublicWebsiteValues" }
        revision: { type: integer, minimum: 0 }
        public_slug: { type: string }
        public_url: { type: string }
        preview_url: { type: string }
        logo_url: { type: [string, "null"] }
        hero_image_url: { type: [string, "null"] }
    GeneralSettings:
      type: object
      required: [id, subscriber_id, values, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        subscriber_id: { type: string, format: uuid, readOnly: true }
        values: { $ref: "#/components/schemas/GeneralSettingsInput" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GeneralSettingsInput:
      type: object
      additionalProperties: false
      required: [company_name, site_name, logo_url, favicon_url, site_link, site_ssl_link, seo_friendly_url, page_title_format, site_description, site_keywords, faster_browsing, recharge_voucher, testimonial, blog, knowledge_base, support_ticket, show_service_price, show_service_icon, affiliate_system, gift_certificate, gift_certificate_tax, withdrawal_request, eu_cookie_law, email_history_save, user_manage_credit_card, mobile_app, display_track_order, display_downloads, index_redirect, logout_redirect, add_fund_enabled, add_fund_tax_enabled, minimum_add_fund, maximum_add_fund, maximum_balance]
      properties:
        company_name: { type: string, maxLength: 200 }
        site_name: { type: string, maxLength: 200 }
        logo_url: { type: string, maxLength: 2048, description: Empty or an absolute HTTP/HTTPS image URL }
        favicon_url: { type: string, maxLength: 2048, description: Empty or an absolute HTTP/HTTPS image URL }
        site_link: { type: string, maxLength: 2048, description: Compatibility value only; no routing or provisioning }
        site_ssl_link: { type: string, maxLength: 2048, description: Empty or HTTPS compatibility value; no SSL provisioning }
        seo_friendly_url: { type: boolean }
        page_title_format: { type: string, enum: ["", Default] }
        site_description: { type: string, maxLength: 4000 }
        site_keywords: { type: string, maxLength: 2000 }
        faster_browsing: { type: boolean }
        recharge_voucher: { type: boolean }
        testimonial: { type: boolean }
        blog: { type: boolean }
        knowledge_base: { type: boolean }
        support_ticket: { type: boolean }
        show_service_price: { type: boolean }
        show_service_icon: { type: boolean }
        affiliate_system: { type: boolean }
        gift_certificate: { type: boolean }
        gift_certificate_tax: { type: boolean }
        withdrawal_request: { type: boolean }
        eu_cookie_law: { type: boolean }
        email_history_save: { type: boolean }
        user_manage_credit_card: { type: boolean }
        mobile_app: { type: boolean }
        display_track_order: { type: boolean }
        display_downloads: { type: boolean }
        index_redirect: { type: string, maxLength: 2048 }
        logout_redirect: { type: string, maxLength: 2048 }
        add_fund_enabled: { type: boolean }
        add_fund_tax_enabled: { type: boolean }
        minimum_add_fund: { $ref: "#/components/schemas/SettingsMoney" }
        maximum_add_fund: { $ref: "#/components/schemas/SettingsMoney" }
        maximum_balance: { $ref: "#/components/schemas/SettingsMoney" }
    SettingsMoney:
      type: ["string", "null"]
      pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
      description: Null for unset, otherwise a nonnegative exact decimal string, at most 16 integer and 2 fractional digits; JSON floating-point numbers are rejected.
    AuthEntry:
      type: object
      required: [adminPath, isAdminEntry]
      properties:
        adminPath: { type: ["string", "null"] }
        isAdminEntry: { type: boolean }
    AdminCredentialsInput:
      type: object
      additionalProperties: false
      required: [email, password, entryPath]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        entryPath: { type: string, maxLength: 97 }
    AccountInput:
      type: object
      additionalProperties: false
      required: [owner, business, username, email, phone, country, password]
      properties:
        owner: { type: string, minLength: 2, maxLength: 150 }
        business: { type: string, minLength: 2, maxLength: 150 }
        username: { type: string, pattern: "^[a-zA-Z0-9_.-]{3,50}$" }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 6, maxLength: 50 }
        country: { type: string, minLength: 2, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 128 }
    CredentialsInput:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    PlanInput:
      type: object
      additionalProperties: false
      required: [name, price, description, highlights, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: number, minimum: 0, maximum: 9999999999.99 }
        description: { type: string, maxLength: 2000 }
        highlights: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
    SubscriptionAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [approve, activate, plan, extend, suspend, reactivate, revoke] }
        planId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    SubscriberUpdate:
      type: object
      additionalProperties: false
      properties:
        owner: { type: string, minLength: 2, maxLength: 150 }
        business: { type: string, minLength: 2, maxLength: 150 }
        username: { type: string, pattern: "^[a-zA-Z0-9_.-]{3,50}$" }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 6, maxLength: 50 }
        country: { type: string, minLength: 2, maxLength: 100 }
        notes: { type: string, maxLength: 5000 }
        expiresAt: { type: ["string", "null"], format: date-time }
    Plan:
      allOf:
        - { $ref: "#/components/schemas/PlanInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }
    Subscriber:
      type: object
      required: [id, business, owner, username, email, phone, country, plan, planId, status, registeredAt, expiresAt, lastLogin, domain, domainStatus, verification, notes, licenceKey, activatedAt, allowed, accessReason]
      properties:
        id: { type: string }
        business: { type: string }
        owner: { type: string }
        username: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        plan: { type: string }
        planId: { type: ["string", "null"] }
        status: { type: string, enum: [PENDING, TRIAL, ACTIVE, SUSPENDED, EXPIRED, REVOKED] }
        registeredAt: { type: string }
        expiresAt: { type: ["string", "null"] }
        lastLogin: { type: ["string", "null"] }
        domain: { type: string }
        domainStatus: { type: string }
        verification: { type: string }
        notes: { type: string }
        licenceKey: { type: ["string", "null"] }
        activatedAt: { type: ["string", "null"] }
        allowed: { type: boolean }
        accessReason: { type: string }
    SessionState:
      type: object
      required: [role, subscriberId, origin, name]
      properties:
        role: { type: ["string", "null"], enum: [admin, subscriber, null] }
        subscriberId: { type: ["string", "null"] }
        origin: { type: ["string", "null"], enum: [login, register, null] }
        name: { type: string }
    LogEntry:
      type: object
      required: [id, at, actor, action, target]
      properties:
        id: { type: string }
        at: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
    AdminAccount:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    PlatformState:
      type: object
      required: [session, subscribers, plans, logs, admins]
      properties:
        session: { $ref: "#/components/schemas/SessionState" }
        subscribers: { type: array, items: { $ref: "#/components/schemas/Subscriber" } }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        logs: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        admins: { type: array, items: { $ref: "#/components/schemas/AdminAccount" } }
    PanelAccess:
      type: object
      required: [subscriberId, allowed]
      properties:
        subscriberId: { type: string }
        allowed: { type: boolean }
    Success:
