            application/json:
              schema: { $ref: "#/components/schemas/PublicWebsiteConfiguration" }
        "400": { description: Invalid input or image ownership }
        "409": { description: Configuration changed since it was loaded }
  /cms/public-website/preview:
    post:
      operationId: previewCurrentPublicWebsite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicWebsitePreviewInput" }
      responses:
        "200":
          description: Same frozen shared template rendered with unsaved owned values
          content:
            application/json:
              schema:
                type: object
                required: [html, logo_url, hero_image_url]
                properties:
                  html: { type: string }
                  logo_url: { type: [string, "null"] }
                  hero_image_url: { type: [string, "null"] }
                  asset_urls:
                    type: object
                    additionalProperties: { type: string }
  /cms/public-website/presentation:
    get:
      operationId: getCurrentPublicPresentation
      responses:
        "200":
          description: Authenticated subscriber Top Area and Banner configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPresentationConfiguration" }
    put:
      operationId: updateCurrentPublicPresentation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicPresentationUpdate" }
      responses:
        "200":
          description: Confirmed saved Top Area and Banner configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPresentationConfiguration" }
        "400": { description: Invalid input or image ownership }
        "409": { description: Revision conflict }
  /cms/public-website/assets:
    post:
      operationId: uploadPublicWebsiteAsset
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Validated, normalized subscriber-owned image
          content:
            application/json:
              schema:
                type: object
                required: [id, url]
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string }
        "400": { description: Invalid image }
        "413": { description: Image exceeds 5 MB }
  /cms/public-website/assets/{assetId}:
    delete:
      operationId: deleteUnusedPublicWebsiteAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unreferenced owned image removed }
        "404": { description: Image not found for this subscriber }
        "409": { description: Image is still used by saved website configuration }
  /settings/general:
    get:
      operationId: getCurrentGeneralSettings
      summary: Read the eligible authenticated subscriber's General Settings
      responses:
        "200":
          description: Persisted configuration; identity comes from the session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "401": { description: Authentication required }
        "403": { description: Subscriber account and eligible licence required }
    put:
      operationId: updateCurrentGeneralSettings
      summary: Replace the eligible authenticated subscriber's General Settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneralSettingsInput" }
      responses:
        "200":
          description: Confirmed persisted configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "400": { description: Invalid fields or unexpected properties }
        "401": { description: Authentication required }
        "403": { description: Subscriber account and eligible licence required }
  /auth/entry:
    get:
      operationId: resolveAuthEntry
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Runtime entry context; private path returned only at that entry or to an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEntry" }
        "403":
          description: Subscriber cannot access the admin entry
  /auth/admin-login:
    post:
      operationId: loginAdministrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCredentialsInput" }
      responses:
        "200":
          description: Authenticated platform administrator; session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
        "403":
          description: Account has no platform administrator membership
  /auth/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Registered as pending; authenticated owner session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /auth/login:
    post:
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialsInput" }
      responses:
        "200":
          description: Authenticated; session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /auth/logout:
    post:
      operationId: logoutAccount
      responses:
        "200":
          description: Session invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /state:
    get:
      operationId: getPlatformState
      responses:
        "200":
          description: Admin data or only the authenticated subscriber's own metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/plans:
    post:
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan created; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan updated including enable/disable; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/subscribers/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: manageSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAction" }
      responses:
        "200":
          description: Transactional licence change and audit event; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /admin/subscribers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editSubscriber
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriberUpdate" }
      responses:
        "200":
          description: Subscriber details updated; admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /subscribers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubscriber
      responses:
        "200":
          description: Owner's own subscriber or admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriber" }
  /subscribers/{id}/panel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubscriberPanel
      responses:
        "200":
          description: Tenant checked and licence allowed; business modules remain deferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelAccess" }
        "403":
          description: Tenant mismatch or pending/suspended/expired/revoked licence
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    FoundationPage: {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
    FoundationSearch: {in: query, name: search, schema: {type: string, maxLength: 100}}
    FoundationServiceType: {in: query, name: serviceType, schema: {type: string, enum: [imei, server, file, remote]}}
  schemas:
    ProviderInput:
      type: object
      required: [name, protocol, baseUrl, enabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        protocol: {type: string, enum: [fusion_rest, DHRU_FUSION_LEGACY_V61]}
        baseUrl: {type: string, maxLength: 300}
        token: {type: string, maxLength: 4096, writeOnly: true}
        username: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
        apiAccessKey: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        enabled: {type: boolean}
    ProviderPricingPolicy:
      type: object
      required: [percentage, fixedUsd, groups]
      properties:
        percentage: {type: string}
        fixedUsd: {type: string}
        groups:
          type: array
          items: {$ref: "#/components/schemas/ProviderGroupMarkup"}
    ProviderGroupMarkup:
      type: object
      required: [groupId, percentage, fixedUsd]
      properties:
        groupId: {type: string, format: uuid}
        percentage: {type: string}
        fixedUsd: {type: string}
    ProviderConnection:
      type: object
      required: [id, name, protocol, baseUrl, enabled, health, credentialSaved, currency, balance, serviceCount, lastTestAt, lastSyncAt, safeError, pricingPolicy]
      properties:
        id: {type: string}
        name: {type: string}
        protocol: {type: string}
        baseUrl: {type: string}
        enabled: {type: boolean}
        health: {type: string}
        credentialSaved: {type: boolean}
        currency: {type: [string, "null"]}
        balance: {type: [string, "null"]}
        serviceCount: {type: integer}
        lastTestAt: {type: [string, "null"]}
        lastSyncAt: {type: [string, "null"]}
        safeError: {type: [string, "null"]}
        pricingPolicy: {$ref: "#/components/schemas/ProviderPricingPolicy"}
    ProviderProtocol:
      type: object
      required: [code, name, available, reason]
      properties:
        code: {type: string}
        name: {type: string}
        available: {type: boolean}
        reason: {type: [string, "null"]}
    ProviderList:
      type: object
      required: [data, protocols, storageReady]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/ProviderConnection"}}
        protocols: {type: array, items: {$ref: "#/components/schemas/ProviderProtocol"}}
        storageReady: {type: boolean}
    ProviderTestResult:
      type: object
      required: [health, currency, balance]
      properties:
        health: {type: string}
        diagnosticCode:
          type: [string, "null"]
          description: Optional fixed, redacted Legacy diagnostic code. Never contains upstream text or credentials.
        upstreamHttpStatus:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
          description: Optional numeric upstream status for Legacy HTTP_FAILURE only; absent or null for other failures. Not the incoming BHRU response status.
        currency: {type: [string, "null"]}
        balance: {type: [string, "null"]}
    ProviderJobInput:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [TEST,SYNC]}
    ProviderJob:
      type: object
      required: [id, kind, state, attempts, counts, safeError, createdAt, startedAt, completedAt]
      properties:
        id: {type: string}
        kind: {type: string}
        state: {type: string}
        attempts: {type: integer}
        counts: {type: object, additionalProperties: {type: integer}}
        safeError: {type: [string, "null"]}
        createdAt: {type: string}
        startedAt: {type: [string, "null"]}
        completedAt: {type: [string, "null"]}
    ProviderJobList:
      type: object
      required: [data, page, hasMore]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/ProviderJob"}}
        page: {type: integer}
        hasMore: {type: boolean}
    ProviderCatalogItem:
      type: object
      required: [id, upstreamId, name, serviceType, categoryId, categoryName, cost, currency, previousCost, changes, reviewReasons, missing, availability, linkedServiceId, retailPriceUsd, estimatedTime]
      properties:
        id: {type: string}
        upstreamId: {type: string}
        name: {type: string}
        serviceType: {type: [string, "null"]}
        categoryId: {type: [string, "null"]}
        categoryName: {type: [string, "null"]}
        cost: {type: string}
        currency: {type: string}
        previousCost: {type: [string, "null"]}
        changes: {type: array, items: {type: string}}
        reviewReasons: {type: array, items: {type: string}}
        missing: {type: boolean}
        availability: {type: [boolean, "null"]}
        linkedServiceId: {type: [string, "null"]}
        retailPriceUsd: {type: [string, "null"]}
        estimatedTime: {type: string}
    ProviderCategory:
      type: object
      required: [id, name, count]
      properties:
        id: {type: string}
        name: {type: string}
        count: {type: integer}
    ProviderCatalogList:
      type: object
      required: [data, categories, page, hasMore]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/ProviderCatalogItem"}}
        categories: {type: array, items: {$ref: "#/components/schemas/ProviderCategory"}}
        page: {type: integer}
        hasMore: {type: boolean}
    ProviderImportItem:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 160}
        priceUsd: {type: string}
    ProviderImportInput:
      type: object
      required: [items, pricing]
      properties:
        items: {type: array, minItems: 1, maxItems: 500, items: {$ref: "#/components/schemas/ProviderImportItem"}}
        pricing: {$ref: "#/components/schemas/ProviderPricingPolicy"}
        groupId: {type: [string, "null"]}
        newGroupName: {type: string, maxLength: 100}
        previewHash: {type: string}
    ProviderImportPreviewItem:
      type: object
      required: [id, name, sourceCurrency, sourceCost, fxRate, convertedCostUsd, proposedPriceUsd, marginUsd, currentPriceUsd, linkedServiceId, groupPrices]
      properties:
        id: {type: string}
        name: {type: string}
        sourceCurrency: {type: string}
        sourceCost: {type: string}
        fxRate: {type: string}
        convertedCostUsd: {type: string}
        proposedPriceUsd: {type: string}
        marginUsd: {type: string}
        currentPriceUsd: {type: [string, "null"]}
        linkedServiceId: {type: [string, "null"]}
        groupPrices:
          type: array
          items: {$ref: "#/components/schemas/ProviderGroupPrice"}
    ProviderGroupPrice:
      type: object
      required: [groupId, priceUsd]
      properties:
        groupId: {type: string}
        priceUsd: {type: string}
    ProviderImportPreview:
      type: object
      required: [previewHash, items, formula, visibility]
      properties:
        previewHash: {type: string}
        formula: {type: string}
        visibility: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/ProviderImportPreviewItem"}}
    ProviderImportResult:
      type: object
      required: [imported, existing, serviceIds]
      properties:
        imported: {type: integer}
        existing: {type: integer}
        serviceIds: {type: array, items: {type: string}}
    EmptyPaymentAction:
      type: object
      additionalProperties: false
    AdminGatewayPolicyInput:
      type: object
      additionalProperties: false
      required: [globalEnabled, resellerAvailable]
      properties:
        globalEnabled: {type: boolean}
        resellerAvailable: {type: boolean}
    FundingCreateInput:
      allOf:
        - {$ref: "#/components/schemas/FundingIntent"}
        - {type: object, required: [idempotencyKey], properties: {idempotencyKey: {type: string, format: uuid}}}
    GatewayList:
      type: object
      required: [data, credentialStorageReady]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/GatewayView"}}
        credentialStorageReady: {type: boolean}
    GatewayField:
      type: object
      required: [key, label, secret, required]
      properties:
        key: {type: string}
        label: {type: string}
        secret: {type: boolean}
        required: {type: boolean}
    GatewayCurrencyRule:
      type: object
      required: [currency, minimum, maximum, feeBps, fixedFee]
      properties:
        currency: {type: string}
        minimum: {type: string}
        maximum: {type: string}
        feeBps: {type: integer, minimum: 0, maximum: 10000}
        fixedFee: {type: string}
    GatewayConfigInput:
      type: object
      additionalProperties: false
      required: [enabled, instructions, currencyRules]
      properties:
        enabled: {type: boolean}
        instructions: {type: string, maxLength: 1000}
        currencyRules: {type: array, items: {$ref: "#/components/schemas/GatewayCurrencyRule"}}
        credentials: {type: object, additionalProperties: {type: string}}
    GatewayView:
      type: object
      required: [code, displayName, description, supportedCurrencies, supportedMethods, automaticConfirmationSupported, webhookSupported, requiredCredentials, configurationFields, integrationStatus, version, feesSupported, globalEnabled, resellerAvailable, operational, enabled, instructions, currencyRules, configuredCredentialFields, validationStatus]
      properties:
        capabilities: {$ref: "#/components/schemas/PaymentCapabilities"}
        callbackPath: {type: [string, "null"]}
        code: {type: string}
        displayName: {type: string}
        description: {type: string}
        supportedCurrencies: {type: array, items: {type: string}}
        configurationSchema: {type: object, additionalProperties: true}
        supportedMethods: {type: array, items: {type: string}}
        automaticConfirmationSupported: {type: boolean}
        webhookSupported: {type: boolean}
        requiredCredentials: {type: array, items: {$ref: "#/components/schemas/GatewayField"}}
        configurationFields: {type: array, items: {$ref: "#/components/schemas/GatewayField"}}
        integrationStatus: {type: string, enum: [AVAILABLE, NOT_IMPLEMENTED, DISABLED]}
        version: {type: string}
        feesSupported: {type: boolean}
        globalEnabled: {type: boolean}
        resellerAvailable: {type: boolean}
        operational: {type: boolean}
        enabled: {type: boolean}
        instructions: {type: string}
        currencyRules: {type: array, items: {$ref: "#/components/schemas/GatewayCurrencyRule"}}
        configuredCredentialFields: {type: array, items: {type: string}}
        validationStatus: {type: string, enum: [NOT_IMPLEMENTED, NOT_CONFIGURED, NOT_VALIDATED, VALID, INVALID]}
    FundingIntent:
      type: object
      required: [gatewayCode, paymentMethod, amount, paymentCurrency]
      properties:
        gatewayCode: {type: string}
        paymentMethod: {type: string}
        amount: {type: string, description: Requested wallet credit in fixed account currency}
        paymentCurrency: {type: string}
    FundingQuote:
      type: object
      required: [accountCurrency, paymentCurrency, requestedCreditUnits, paymentBaseMinor, feeMinor, expectedPaymentMinor, formattedCredit, formattedBase, formattedFee, formattedPayable, fxDescription]
      properties:
        accountCurrency: {type: string}
        paymentCurrency: {type: string}
        requestedCreditUnits: {type: string}
        paymentBaseMinor: {type: string}
        feeMinor: {type: string}
        expectedPaymentMinor: {type: string}
        formattedCredit: {type: string}
        formattedBase: {type: string}
        formattedFee: {type: string}
        formattedPayable: {type: string}
        fxDescription: {type: string}
    FundingPayment:
      type: object
      required: [id, status, amountMinor, formattedAmount, currency, providerReference, createdAt, settledAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [VERIFIED, SETTLED, FAILED]}
        amountMinor: {type: string}
        formattedAmount: {type: string}
        currency: {type: string}
        providerReference: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        settledAt: {type: [string, "null"], format: date-time}
    FundingView:
      allOf:
        - {$ref: "#/components/schemas/FundingQuote"}
        - type: object
          required: [id, gatewayCode, gatewayName, paymentMethod, customerName, status, createdAt, updatedAt, expiresAt, payments, paidAt, creditedWalletAmount, reviewRequired, reviewReasons, settlementStatus, processing]
          properties:
            paidAt: {type: [string, "null"], format: date-time}
            creditedWalletAmount: {type: [string, "null"]}
            reviewRequired: {type: boolean}
            reviewReasons: {type: array, items: {type: string}}
            settlementStatus: {type: string, enum: [NONE, VERIFIED, SETTLED, REVIEW_REQUIRED, FAILED]}
            processing: {$ref: "#/components/schemas/FundingProcessing"}
            id: {type: string, format: uuid}
            gatewayCode: {type: string}
            gatewayName: {type: string}
            paymentMethod: {type: string}
            customerName: {type: [string, "null"]}
            status: {type: string, enum: [CREATED, PENDING_PAYMENT, PAID, FAILED, EXPIRED, CANCELLED]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            payments: {type: array, items: {$ref: "#/components/schemas/FundingPayment"}}
    FundingList:
      type: object
      required: [data, hasMore]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/FundingView"}}
        hasMore: {type: boolean}
    PaymentCapabilities:
      type: object
      required: [createPayment, idempotentCreation, statusLookup, webhookVerification, cancelPayment, refundPayment]
      properties:
        createPayment: {type: boolean}
        idempotentCreation: {type: boolean}
        statusLookup: {type: boolean}
        webhookVerification: {type: boolean}
        cancelPayment: {type: boolean}
        refundPayment: {type: boolean}
    PaymentReview:
      type: object
      required: [id, fundingId, gatewayCode, category, createdAt, providerReference, amountMinor, currency]
      properties:
        id: {type: string, format: uuid}
        fundingId: {type: [string, "null"], format: uuid}
        gatewayCode: {type: string}
        category: {type: string}
        createdAt: {type: string, format: date-time}
        providerReference: {type: [string, "null"]}
        amountMinor: {type: [string, "null"]}
        currency: {type: [string, "null"]}
    PaymentReviewList:
      type: object
      required: [data, hasMore]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/PaymentReview"}}
        hasMore: {type: boolean}
    FundingProcessing:
      type: [object, "null"]
      required: [state, paymentUrl, paymentAddress, instructions, expiresAt]
      properties:
        state: {type: string, enum: [READY, PROCESSING, REVIEW_REQUIRED, FAILED]}
        paymentUrl: {type: [string, "null"]}
        paymentAddress: {type: [string, "null"]}
        instructions: {type: string}
        expiresAt: {type: [string, "null"], format: date-time}
    PaymentMonitoring:
      type: object
      required: [gatewayCode, gatewayName, integrationStatus, globalEnabled, configuredResellers, pending, verifiedUnsettled, failedProcessing, reviewRequired]
      properties:
        gatewayCode: {type: string}
        gatewayName: {type: string}
        integrationStatus: {type: string}
        globalEnabled: {type: boolean}
        configuredResellers: {type: integer}
        pending: {type: integer}
        verifiedUnsettled: {type: integer}
        failedProcessing: {type: integer}
        reviewRequired: {type: integer}
    PaymentMonitoringList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/PaymentMonitoring"}}
    PaymentReconciliation:
      type: object
      required: [fundingId, consistent, issues, readOnly]
      properties:
        fundingId: {type: string, format: uuid}
        consistent: {type: boolean}
        issues: {type: array, items: {type: string}}
        readOnly: {type: boolean}
    WebhookAcknowledgement:
      type: object
      required: [received, authenticated, queued, duplicate]
      properties:
        received: {type: boolean}
        authenticated: {type: boolean}
        queued: {type: boolean}
        duplicate: {type: boolean}
    CustomerSecurityAction:
      type: object
      additionalProperties: false
    CustomerSecurityResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        affected: {type: integer}
    CustomerPasswordChangeInput:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      additionalProperties: false
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128}
        newPassword: {type: string, minLength: 8, maxLength: 128}
        confirmPassword: {type: string, minLength: 8, maxLength: 128}
    CustomerPasswordResetInput:
      type: object
      required: [token, newPassword, confirmPassword]
