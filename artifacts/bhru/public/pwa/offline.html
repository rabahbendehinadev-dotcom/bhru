<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fc">
  <title>BHRU — Offline</title>
  <script>
    try { if (localStorage.getItem('bhru:pwa-theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.querySelector('meta[name="theme-color"]').content = '#090e19';
    } } catch {}
  </script>
  <style>
    *{box-sizing:border-box}html{background:#f5f7fc;color:#111827;font-family:system-ui,sans-serif;color-scheme:light}
    html[data-theme=dark]{background:#090e19;color:#e5eaf1;color-scheme:dark}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
    main{width:100%;max-width:350px}strong{color:#ed6b06;font-size:22px}h1{font-size:24px;margin-top:28px}p{font-size:15px;line-height:1.6;opacity:.75}
    button{min-height:48px;border:0;border-radius:10px;background:#ed6b06;color:white;padding:12px 24px;font:600 15px system-ui;cursor:pointer}
    small{display:block;margin-top:24px;line-height:1.6;opacity:.65}
  </style>
</head>
<body>
  <main><strong>BHRU</strong><h1>You’re offline</h1><p>Connect to the internet to open your subscriber panel.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <small>Your account and session data are never saved in the offline cache. Your existing sign-in will be checked when you reconnect.</small>
  </main>
</body>
</html>
